name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Lint and test (${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            python-version: ["3.12", "3.13"]
        steps:
            - name: Check out the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: ${{ matrix.python-version}}
                cache: pip
                cache-dependency-path: pyproject.toml

            - name: Install the app and dev tools
              run: pip install -e ".[dev]"
            - name: Lint
              run: ruff check . 
            - name: Check formatting
              run: ruff format --check . 
            - name: Run tests
              run: pytest -q
    build:
      name: Build and scan image
      needs: test
      runs-on: ubuntu-latest
      permissions:
          contents: read
          packages: write
          security-events: write
      outputs:
          digest: ${{ steps.push.outputs.digest }}
      steps:
          - name: Check out the code
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
          - name: Log in to GHCR
            if: github.event_name == 'push'
            uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
            with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
          - name: Work out image tags
            id: meta
            uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
            with:
                images: ghcr.io/${{ github.repository }}
                tags: |
                    type=sha
                    type=raw,value=latest,enable={{is_default_branch}}

          - name: Build image into the local Docker
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
                context: .
                load: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

          - name: Scan (full report as SARIF)
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
                image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
                format: sarif
                output: trivy.sarif
          - name: Upload results to the Security tab
            uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
            with:
                sarif_file: trivy.sarif
                category: trivy

          - name: Generate SBOM (CycloneDX)
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
                image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
                format: cyclonedx
                output: sbom.cdx.json
                skip-setup-trivy: true
          - name: Save SBOM as a build artifact
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
                name: sbom
                path: sbom.cdx.json

          - name: Gate on fixable CRITICAL vulnerabilities
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
                image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
                severity: CRITICAL
                ignore-unfixed: true
                exit-code: "1"
                format: table
                skip-setup-trivy: true

          - name: Push to GHCR (main only)
            id: push
            if: github.event_name == 'push'
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
  
          - name: Scan (JSON for Scanboard)
            if: github.event_name == 'push'
            uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
            with:
                image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
                format: json
                output: trivy.json
                skip-setup-trivy: true

          - name: Report to Scanboard
            if: github.event_name == 'push'
            continue-on-error: true
            env:
                SCANBOARD_URL: ${{ secrets.SCANBOARD_URL }}
                SCANBOARD_API_KEY: ${{ secrets.SCANBOARD_API_KEY }}
                IMAGE_REF: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
                IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
                RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            run: |
                curl -fsS -X POST "$SCANBOARD_URL/api/v1/ingest" \
                  -H "Authorization: Bearer $SCANBOARD_API_KEY" \
                  -F commit_sha="$GITHUB_SHA" \
                  -F branch="$GITHUB_REF_NAME" \
                  -F image_ref="$IMAGE_REF" \
                  -F image_digest="$IMAGE_DIGEST" \
                  -F pipeline_url="$RUN_URL" \
                  -F vuln_report=@trivy.json \
                  -F sbom=@sbom.cdx.json

    ci-passed:
      name: CI passed
      needs: [test, build]
      if: always()
      runs-on: ubuntu-latest
      steps:
        - name: Fail unless every job succeeded
          if: contains(needs.*.result, 'failure') || contains(needs.*.result,'cancelled') || contains(needs.*.result, 'skipped')
          run: |
            echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
            exit 1
        - name: All jobs passed
          run: echo "All matrix jobs succeeded."
          