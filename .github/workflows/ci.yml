name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Lint and test (${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            python-version: ["3.12", "3.13"]
        steps:
            - name: Check out the code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: ${{ matrix.python-version}}
                cache: pip
                cache-dependency-path: pyproject.toml

            - name: Install the app and dev tools
              run: pip install -e ".[dev]"
            - name: Lint
              run: ruff check . 
            - name: Check formatting
              run: ruff format --check . 
            - name: Run tests
              run: pytest -q
    ci-passed:
      name: CI passed
      needs: test
      if: always()
      runs-on: ubuntu-latest
      steps:
        - name: Fail unless every test job succeeded
          if: needs.test.result != 'success'
          run: |
            echo "Test jobs finished with: ${{ needs.test.results }}"
            exit 1
        - name: All test jobs passed
          run: echo "All matrix jobs succeeded."
              