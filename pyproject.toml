[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanboard"
version = "0.1.0"
description = "Lightweight, pipeline-native dashboard for container vulnerability scans and SBOMs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax,
# B: bugbear, S: bandit security checks.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]  # asserts and fake tokens are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
