services:
  scanboard:
    build: .
    image: scanboard:local
    ports:
      - "8000:8000"
    environment:
      # Set a long random value, e.g. `openssl rand -hex 32`
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      BASE_URL: http://localhost:8000
    volumes:
      - scanboard-data:/data
    restart: unless-stopped

volumes:
  scanboard-data:
